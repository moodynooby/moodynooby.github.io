<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <title>Judgement Game</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
  <style>
    body {
      background-color:  #1c1b22 ; /* Very dark gray */
      color: #D9CAB3; /* Light brown for text */
    }
    .container{      font-family: Zilla Slab;
    }
    .player {
      background-color: #5b5b66; /* Dark brown */
      color: #F7F3E8; /* Off-white for text inside the boxes */
      width: 400px;
      height: 200px;
      border: 1px solid black;
      float: left;
      margin: 10px;
      text-align: center;
      padding: 10px;
      font-size: 20px;
    }

    .player-name {
      font-size: 50px;
    }

    .button  {
      position: relative;
      background-color:  #2b2a33 ;
      border: none;
      font-size: 20px;
      color: #FFFFFF;
      padding: 20px;
      width: 100px;
      text-align: center;
      border-radius: 20px;
      transition-duration: 0.4s;
      text-decoration: none;
      overflow: hidden;
      cursor: pointer;
    }

    .button:after {
      content: "";
      background: #f1f1f1;
      display: block;
      position: absolute;
      padding-top: 300%;
      padding-left: 350%;
      margin-left: -20px !important;
      margin-top: -120%;
      opacity: 0;
      transition: all 0.8s
    }

    .button:active:after {
      padding: 0;
      margin: 0;
      opacity: 1;
      transition: 0s
    }
  </style>
</head>
<body class="bg-dark text-light" > <div class="container">
  <h1 >Judgement Game</h1>

  <div class="row">
    <div class="col-md-6">
      <div class="player">
        <div class="player-name">Manas</div>
        <div id="score1Display">0</div>
        <div class="container text-center">
          <div id="hand1Display">0</div>
        </div>
        <button type="button" class="button btn-outline-primary" onclick="hand1++; document.getElementById('hand1Display').textContent = hand1;" >+</button>
        <button class="button" onclick="hand1--; document.getElementById('hand1Display').textContent = hand1;">-</button>
        <button class="button" onclick="point1()">\o/</button>
      </div>
    </div>

    <div class="col-md-6">
      <div class="player">
        <div class="player-name">Fagun</div>
        <div id="score2Display">0</div>
        <div class="container text-center">
          <div id="hand2Display">0</div>
        </div>
        <button class="button" onclick="hand2++; document.getElementById('hand2Display').textContent = hand2;">+</button>
        <button class="button" onclick="hand2--; document.getElementById('hand2Display').textContent = hand2;">-</button>
        <button class="button" onclick="point2()">\o/</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="player">
        <div class="player-name">Ghanshyam</div>
        <div id="score3Display">0</div>
        <div class="container text-center">
          <div id="hand3Display">0</div>
        </div>
        <button class="button" onclick="hand3++; document.getElementById('hand3Display').textContent = hand3;">+</button>
        <button class="button" onclick="hand3--; document.getElementById('hand3Display').textContent = hand3;">-</button>
        <button class="button" onclick="point3()">\o/</button>
      </div>
    </div>

    <div class="col-md-6">
      <div class="player">
        <div class="player-name">Jashmin</div>
        <div id="score4Display">0</div>
        <div class="container text-center">
          <div id="hand4Display">0</div>
        </div>
        <button class="button" onclick="hand4++; document.getElementById('hand4Display').textContent = hand4;">+</button>
        <button class="button" onclick="hand4--; document.getElementById('hand4Display').textContent = hand4;">-</button>
        <button class="button" onclick="point4()">\o/</button>
      </div>
    </div>
  </div>
</div>

<script>
  let score1 = 0;
  let hand1 = 0;

  function point1() {
    if (hand1 == 0) {
      score1 += 10;
    } else {
      score1 += hand1 * 10;
    }
    document.getElementById("score1Display").textContent = score1;
  }

  let score2 = 0;
  let hand2 = 0;

  function point2() {
    if (hand2 == 0) {
      score2 += 10;
    } else {
      score2 += hand2 * 10;
    }
    document.getElementById("score2Display").textContent = score2;
  }

  let score3 = 0;
  let hand3 = 0;

  function point3() {
    if (hand3 == 0) {
      score3 += 10;
    } else {
      score3 += hand3 * 10;
    }
    document.getElementById("score3Display").textContent = score3;
  }

  let score4 = 0;
  let hand4 = 0;

  function point4() {
    if (hand4 == 0) {
      score4 += 10;
    } else {
      score4 += hand4 * 10;
    }
    document.getElementById("score4Display").textContent = score4;
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
